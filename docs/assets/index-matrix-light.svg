<svg xmlns="http://www.w3.org/2000/svg" width="960" height="568" viewBox="0 0 960 568" role="img" aria-label="ProChoice six composite index matrix across Coding, Writing, Design, Research, Cyber, and Harnesses">
  <title>ProChoice Composite Index Matrix</title>
  <defs>
    <clipPath id="frame-clip">
      <rect x="0" y="0" width="960" height="568" rx="8" />
    </clipPath>
    <style>
      .wordmark { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-size: 16.5px; font-weight: 500; letter-spacing: -0.02em; fill: #111111; }
      .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #68655e; }
      .domain { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-size: 21px; font-weight: 400; letter-spacing: -0.02em; fill: #111111; }
      .arrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #8c877d; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #55534e; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #68655e; }
      .top-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #111111; }
      .sec-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #333330; }
      .effort { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 400; fill: #68655e; }
      .top-val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #333330; }
      .sec-val { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #55534e; }
      .foot-url { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #333330; }
      .foot-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #68655e; }
      .hairline { stroke: #e8e7e3; stroke-width: 1; }
      .spark-area { fill: #2563eb; fill-opacity: 0.08; }
      .spark-line { fill: none; stroke: #333330; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .spark-dot { fill: #111111; }
      .spark-end { fill: #2563eb; }
    </style>
  </defs>

  <g clip-path="url(#frame-clip)">
    <!-- Canvas and elevated matrix plate -->
    <rect x="0" y="0" width="960" height="48" fill="#fafaf8" />
    <rect x="0" y="48" width="960" height="484" fill="#ffffff" />
    <rect x="0" y="532" width="960" height="36" fill="#fafaf8" />

    <!-- Header bar -->
    <g id="header">
      <g transform="translate(28, 12)">
        <rect x="0.75" y="0.75" width="22.5" height="22.5" rx="6" fill="#ffffff" stroke="#d4d2cb" stroke-width="1.2" />
        <g transform="translate(2.65 4.15) scale(0.7)">
          <path d="M10.5 13.1L5.2 7.8L7.4 5.6L12 10.2L10.5 13.1Z" fill="#111111" fill-opacity="0.28" />
          <path d="M10.4 20.5V11.8L16.3 5.9H12.4V3.2H20.8V11.6H18.1V7.7L13.2 12.6V20.5H10.4Z" fill="#111111" />
        </g>
      </g>
      <text x="61" y="29" class="wordmark">prochoice</text>
      <text x="932" y="28" text-anchor="end" class="meta">6 indices · 27 benchmarks · 2026-11-21</text>
      <line x1="0" y1="48" x2="960" y2="48" class="hairline" />
    </g>

    <!-- Matrix structural hairlines -->
    <line x1="480" y1="48" x2="480" y2="532" class="hairline" />
    <line x1="0" y1="209.5" x2="960" y2="209.5" class="hairline" />
    <line x1="0" y1="371" x2="960" y2="371" class="hairline" />
    <line x1="0" y1="532" x2="960" y2="532" class="hairline" />

    <!-- Row 1, Col 1: Coding -->
    <g id="cell-coding" transform="translate(0, 48)">
      <text x="28" y="36" class="domain">Coding<tspan dx="6" dy="-1" class="arrow">&#8594;</tspan></text>
      <text x="28" y="57" class="tagline">Repository changes and migration, incident diagnosis,</text>
      <text x="28" y="73" class="tagline">behavioral reconstruction, algorithm optimization.</text>

      <g>
        <path class="spark-area" d="M348 60 L375.8 53.9 L382.8 47.2 L391.3 45.7 L394.1 41.4 L399.8 39.8 L405.7 37.5 L411.9 36.7 L417.1 33.8 L429.8 33.2 L448 30 L448 60 L348 60 Z" />
        <path class="spark-line" d="M348 60 L375.8 53.9 L382.8 47.2 L391.3 45.7 L394.1 41.4 L399.8 39.8 L405.7 37.5 L411.9 36.7 L417.1 33.8 L429.8 33.2 L448 30" />
        <circle cx="348" cy="60" r="1.8" class="spark-dot" />
        <circle cx="375.8" cy="53.9" r="1.8" class="spark-dot" />
        <circle cx="382.8" cy="47.2" r="1.8" class="spark-dot" />
        <circle cx="391.3" cy="45.7" r="1.8" class="spark-dot" />
        <circle cx="394.1" cy="41.4" r="1.8" class="spark-dot" />
        <circle cx="399.8" cy="39.8" r="1.8" class="spark-dot" />
        <circle cx="405.7" cy="37.5" r="1.8" class="spark-dot" />
        <circle cx="411.9" cy="36.7" r="1.8" class="spark-dot" />
        <circle cx="417.1" cy="33.8" r="1.8" class="spark-dot" />
        <circle cx="429.8" cy="33.2" r="1.8" class="spark-dot" />
        <circle cx="448" cy="30" r="2.8" class="spark-end" />
      </g>

      <line x1="28" y1="93" x2="452" y2="93" class="hairline" />

      <text x="28" y="116" class="label">Highest est.</text>
      <circle cx="105" cy="112" r="3.1" fill="oklch(0.49 0.18 25)" />
      <text x="116" y="116"><tspan class="top-name">Claude Sonnet 5.5</tspan><tspan dx="7" class="effort">Max</tspan></text>
      <text x="452" y="116" text-anchor="end" class="top-val">79.5 · $10.0</text>
      <text class="score-evidence" x="116" y="126" font-size="9" fill="#55534e">3/5 benchmarks · 3 feeds · 95% interval 69.7 to 89.2</text>

      <text x="28" y="139" class="label">Lowest cost</text>
      <rect x="102.2" y="132.2" width="5.6" height="5.6" fill="oklch(0.45 0.12 178)" />
      <text x="116" y="139"><tspan class="sec-name">GPT-6 Luna</tspan><tspan dx="7" class="effort">Low</tspan></text>
      <text x="452" y="139" text-anchor="end" class="sec-val">23.4 · $0.0051</text>
      <text class="score-evidence" x="116" y="149" font-size="9" fill="#55534e">1/5 benchmarks · 1 feed · 95% interval 4.3 to 42.5</text>
    </g>

    <!-- Row 1, Col 2: Writing -->
    <g id="cell-writing" transform="translate(480, 48)">
      <text x="28" y="36" class="domain">Writing<tspan dx="6" dy="-1" class="arrow">&#8594;</tspan></text>
      <text x="28" y="57" class="tagline">Academic briefs, short prose, long fiction,</text>
      <text x="28" y="73" class="tagline">and clinical documentation.</text>

      <g>
        <path class="spark-area" d="M348 60 L448 30 L448 60 L348 60 Z" />
        <path class="spark-line" d="M348 60 L448 30" />
        <circle cx="348" cy="60" r="1.8" class="spark-dot" />
        <circle cx="448" cy="30" r="2.8" class="spark-end" />
      </g>

      <line x1="28" y1="93" x2="452" y2="93" class="hairline" />

      <text x="28" y="116" class="label">Highest est.</text>
      <path d="M105 108.3 l3.6 6.6 h-7.2 z" fill="oklch(0.50 0.19 258)" />
      <text x="116" y="116"><tspan class="top-name">Gemini 3.7 Flash</tspan><tspan dx="7" class="effort">Medium</tspan></text>
      <text x="452" y="116" text-anchor="end" class="top-val">58.0 · $0.022</text>
      <text class="score-evidence" x="116" y="126" font-size="9" fill="#55534e">1/4 benchmarks · 1 feed · 95% interval 44.5 to 71.5</text>

      <text x="28" y="139" class="label">Lowest cost</text>
      <path d="M105 131.3 l3.6 6.6 h-7.2 z" fill="oklch(0.50 0.19 258)" />
      <text x="116" y="139"><tspan class="sec-name">Gemini 3.5 Flash-Lite</tspan><tspan dx="7" class="effort">Minimal</tspan></text>
      <text x="452" y="139" text-anchor="end" class="sec-val">47.8 · $0.013</text>
      <text class="score-evidence" x="116" y="149" font-size="9" fill="#55534e">1/4 benchmarks · 1 feed · 95% interval 34.3 to 61.3</text>
    </g>

    <!-- Row 2, Col 1: Design -->
    <g id="cell-design" transform="translate(0, 209.5)">
      <text x="28" y="36" class="domain">Design<tspan dx="6" dy="-1" class="arrow">&#8594;</tspan></text>
      <text x="28" y="57" class="tagline">Web interfaces, vector illustrations,</text>
      <text x="28" y="73" class="tagline">document layouts and motion graphics.</text>

      <g>
        <path class="spark-area" d="M348 60 L355.8 41.9 L401.5 34.4 L425.2 30.6 L448 30 L448 60 L348 60 Z" />
        <path class="spark-line" d="M348 60 L355.8 41.9 L401.5 34.4 L425.2 30.6 L448 30" />
        <circle cx="348" cy="60" r="1.8" class="spark-dot" />
        <circle cx="355.8" cy="41.9" r="1.8" class="spark-dot" />
        <circle cx="401.5" cy="34.4" r="1.8" class="spark-dot" />
        <circle cx="425.2" cy="30.6" r="1.8" class="spark-dot" />
        <circle cx="448" cy="30" r="2.8" class="spark-end" />
      </g>

      <line x1="28" y1="93" x2="452" y2="93" class="hairline" />

      <text x="28" y="116" class="label">Highest est.</text>
      <circle cx="105" cy="112" r="3.1" fill="oklch(0.49 0.18 25)" />
      <text x="116" y="116"><tspan class="top-name">Claude Sonnet 5.5</tspan><tspan dx="7" class="effort">Extra high</tspan></text>
      <text x="452" y="116" text-anchor="end" class="top-val">69.8 · $3.56</text>
      <text class="score-evidence" x="116" y="126" font-size="9" fill="#55534e">1/4 benchmarks · 1 feed · 95% interval 60.5 to 79.1</text>

      <text x="28" y="139" class="label">Best value</text>
      <rect x="102.2" y="132.2" width="5.6" height="5.6" fill="oklch(0.45 0.12 178)" />
      <text x="116" y="139"><tspan class="sec-name">GPT-6.1 Sol</tspan><tspan dx="7" class="effort">Max</tspan></text>
      <text x="452" y="139" text-anchor="end" class="sec-val">63.5 · $0.27</text>
      <text class="score-evidence" x="116" y="149" font-size="9" fill="#55534e">3/4 benchmarks · 3 feeds · 95% interval 47.8 to 79.2</text>
    </g>

    <!-- Row 2, Col 2: Research -->
    <g id="cell-research" transform="translate(480, 209.5)">
      <text x="28" y="36" class="domain">Research<tspan dx="6" dy="-1" class="arrow">&#8594;</tspan></text>
      <text x="28" y="57" class="tagline">Evidence retrieval, scientific workflows,</text>
      <text x="28" y="73" class="tagline">financial analysis and data interpretation.</text>

      <g>
        <path class="spark-area" d="M348 60 L382 59.4 L390.5 56.5 L400.9 51.1 L405.8 45.9 L418.6 41 L423.8 38.4 L426.1 38.2 L440.8 35.8 L444.9 30.9 L448 30 L448 60 L348 60 Z" />
        <path class="spark-line" d="M348 60 L382 59.4 L390.5 56.5 L400.9 51.1 L405.8 45.9 L418.6 41 L423.8 38.4 L426.1 38.2 L440.8 35.8 L444.9 30.9 L448 30" />
        <circle cx="348" cy="60" r="1.8" class="spark-dot" />
        <circle cx="382" cy="59.4" r="1.8" class="spark-dot" />
        <circle cx="390.5" cy="56.5" r="1.8" class="spark-dot" />
        <circle cx="400.9" cy="51.1" r="1.8" class="spark-dot" />
        <circle cx="405.8" cy="45.9" r="1.8" class="spark-dot" />
        <circle cx="418.6" cy="41" r="1.8" class="spark-dot" />
        <circle cx="423.8" cy="38.4" r="1.8" class="spark-dot" />
        <circle cx="426.1" cy="38.2" r="1.8" class="spark-dot" />
        <circle cx="440.8" cy="35.8" r="1.8" class="spark-dot" />
        <circle cx="444.9" cy="30.9" r="1.8" class="spark-dot" />
        <circle cx="448" cy="30" r="2.8" class="spark-end" />
      </g>

      <line x1="28" y1="93" x2="452" y2="93" class="hairline" />

      <text x="28" y="116" class="label">Highest est.</text>
      <rect x="102.2" y="109.2" width="5.6" height="5.6" fill="oklch(0.45 0.12 178)" />
      <text x="116" y="116"><tspan class="top-name">GPT-6.2 Astra</tspan><tspan dx="7" class="effort">Extra high</tspan></text>
      <text x="452" y="116" text-anchor="end" class="top-val">71.3 · $2.52</text>
      <text class="score-evidence" x="116" y="126" font-size="9" fill="#55534e">4/10 benchmarks · 1 feed · 95% interval 59.5 to 83.1</text>

      <text x="28" y="139" class="label">Lowest cost</text>
      <rect x="102.2" y="132.2" width="5.6" height="5.6" fill="oklch(0.45 0.12 178)" />
      <text x="116" y="139"><tspan class="sec-name">GPT-6 Luna</tspan><tspan dx="7" class="effort">Low</tspan></text>
      <text x="452" y="139" text-anchor="end" class="sec-val">36.8 · $0.0051</text>
      <text class="score-evidence" x="116" y="149" font-size="9" fill="#55534e">3/10 benchmarks · 1 feed · 95% interval 25.2 to 48.4</text>
    </g>

    <!-- Row 3, Col 1: Cyber -->
    <g id="cell-cyber" transform="translate(0, 371)">
      <text x="28" y="36" class="domain">Cyber<tspan dx="6" dy="-1" class="arrow">&#8594;</tspan></text>
      <text x="28" y="57" class="tagline">Defect detection and verification</text>
      <text x="28" y="73" class="tagline">of security repairs.</text>

      <g>
        <path class="spark-area" d="M348 60 L357.6 57.3 L369.2 48.2 L397.8 45.9 L410.1 44 L441.6 38.9 L448 30 L448 60 L348 60 Z" />
        <path class="spark-line" d="M348 60 L357.6 57.3 L369.2 48.2 L397.8 45.9 L410.1 44 L441.6 38.9 L448 30" />
        <circle cx="348" cy="60" r="1.8" class="spark-dot" />
        <circle cx="357.6" cy="57.3" r="1.8" class="spark-dot" />
        <circle cx="369.2" cy="48.2" r="1.8" class="spark-dot" />
        <circle cx="397.8" cy="45.9" r="1.8" class="spark-dot" />
        <circle cx="410.1" cy="44" r="1.8" class="spark-dot" />
        <circle cx="441.6" cy="38.9" r="1.8" class="spark-dot" />
        <circle cx="448" cy="30" r="2.8" class="spark-end" />
      </g>

      <line x1="28" y1="93" x2="452" y2="93" class="hairline" />

      <text x="28" y="116" class="label">Highest est.</text>
      <circle cx="105" cy="112" r="3.1" fill="oklch(0.49 0.18 25)" />
      <text x="116" y="116"><tspan class="top-name">Claude Fable 5.2</tspan><tspan dx="7" class="effort">High</tspan></text>
      <text x="452" y="116" text-anchor="end" class="top-val">73.6 · $67.0</text>
      <text class="score-evidence" x="116" y="126" font-size="9" fill="#55534e">1/2 benchmarks · 1 feed · 95% interval 66.1 to 81.1</text>

      <text x="28" y="139" class="label">Lowest cost</text>
      <rect x="102.2" y="132.2" width="5.6" height="5.6" fill="oklch(0.45 0.12 178)" />
      <text x="116" y="139"><tspan class="sec-name">GPT-6.1 Terra</tspan><tspan dx="7" class="effort">High</tspan></text>
      <text x="452" y="139" text-anchor="end" class="sec-val">53.1 · $3.76</text>
      <text class="score-evidence" x="116" y="149" font-size="9" fill="#55534e">1/2 benchmarks · 1 feed · 95% interval 44.7 to 61.6</text>
    </g>

    <!-- Row 3, Col 2: Harnesses -->
    <g id="cell-harnesses" transform="translate(480, 371)">
      <text x="28" y="36" class="domain">Harnesses<tspan dx="6" dy="-1" class="arrow">&#8594;</tspan></text>
      <text x="28" y="57" class="tagline">Terminal-Bench 4.0 on fixed controls.</text>
      <text x="28" y="73" class="tagline">DeepSWE has its own comparison.</text>

      <g>
        <path class="spark-area" d="M348 60 L353.2 46.3 L440 42.7 L448 30 L448 60 L348 60 Z" />
        <path class="spark-line" d="M348 60 L353.2 46.3 L440 42.7 L448 30" />
        <circle cx="348" cy="60" r="1.8" class="spark-dot" />
        <circle cx="353.2" cy="46.3" r="1.8" class="spark-dot" />
        <circle cx="440" cy="42.7" r="1.8" class="spark-dot" />
        <circle cx="448" cy="30" r="2.8" class="spark-end" />
      </g>

      <line x1="28" y1="93" x2="452" y2="93" class="hairline" />

      <text x="28" y="116" class="label">Highest rate</text>
      <circle cx="105" cy="112" r="3.1" fill="#55534e" />
      <text x="116" y="116"><tspan class="top-name">Hermes Agent</tspan><tspan dx="7" class="effort">v0.22.5</tspan></text>
      <text x="452" y="116" text-anchor="end" class="top-val">20.0% · $1.34</text>
      <text class="score-evidence" x="116" y="126" font-size="9" fill="#55534e">95% interval 9.9 to 30.1%</text>

      <text x="28" y="139" class="label">Cost–score tradeoff</text>
      <circle cx="105" cy="135" r="3.1" fill="#55534e" />
      <text x="116" y="139"><tspan class="sec-name">Codex CLI</tspan><tspan dx="7" class="effort">v0.164.0+baseten-catalog.1</tspan></text>
      <text x="452" y="139" text-anchor="end" class="sec-val">18.2% · $1.11</text>
      <text class="score-evidence" x="116" y="149" font-size="9" fill="#55534e">95% interval 8.1 to 28.4%</text>
    </g>

    <!-- Footer colophon -->
    <g id="footer">
      <text x="28" y="554" class="foot-url">prochoice.industries</text>
      <text x="480" y="554" text-anchor="middle" class="foot-note">Models that cost more while scoring lower are left off the chart</text>
      <text x="932" y="554" text-anchor="end" class="foot-note">Retrograde Labs</text>
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="0.5" y="0.5" width="959" height="567" rx="8" fill="none" stroke="#e2e0d9" stroke-width="1" />
</svg>
